<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#0f172a">Pipeline: daily SPY panel to execution decision</text>

  <!-- column 1: data -->
  <rect x="24" y="60" width="190" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="119" y="86" text-anchor="middle" fill="#0f172a" font-weight="bold">Daily features</text>
  <text x="119" y="106" text-anchor="middle" fill="#334155">OHLCV, realised vol, Amihud</text>
  <rect x="24" y="140" width="190" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="119" y="166" text-anchor="middle" fill="#0f172a" font-weight="bold">BBO imbalance</text>
  <text x="119" y="186" text-anchor="middle" fill="#334155">NASDAQ ITCH, optional</text>
  <rect x="24" y="220" width="190" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="119" y="246" text-anchor="middle" fill="#0f172a" font-weight="bold">Finnhub news count</text>
  <text x="119" y="266" text-anchor="middle" fill="#334155">weighted by ETF holdings</text>

  <!-- column 2: regime -->
  <rect x="272" y="100" width="180" height="84" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="362" y="128" text-anchor="middle" fill="#0f172a" font-weight="bold">Gaussian HMM</text>
  <text x="362" y="148" text-anchor="middle" fill="#334155">fit on train split only</text>
  <text x="362" y="168" text-anchor="middle" fill="#334155">regime label per day</text>

  <!-- column 3: env -->
  <rect x="510" y="60" width="200" height="224" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="610" y="86" text-anchor="middle" fill="#0f172a" font-weight="bold">OptimalExecutionEnv</text>
  <text x="610" y="110" text-anchor="middle" fill="#334155">9-dim state s_t</text>
  <text x="610" y="130" text-anchor="middle" fill="#334155">action a_t in [0, 1]</text>
  <text x="610" y="150" text-anchor="middle" fill="#334155">residual around TWAP</text>
  <text x="610" y="170" text-anchor="middle" fill="#334155">sqrt-participation impact</text>
  <text x="610" y="190" text-anchor="middle" fill="#334155">reward vs TWAP slice</text>
  <rect x="530" y="210" width="160" height="56" rx="6" fill="#ffffff" stroke="#b45309"/>
  <text x="610" y="234" text-anchor="middle" fill="#0f172a" font-weight="bold">PPO policy</text>
  <text x="610" y="252" text-anchor="middle" fill="#334155">MLP 128x128, SB3</text>

  <!-- column 4: eval -->
  <rect x="768" y="60" width="168" height="100" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="852" y="86" text-anchor="middle" fill="#0f172a" font-weight="bold">Path-aligned eval</text>
  <text x="852" y="106" text-anchor="middle" fill="#334155">same (start, T) window</text>
  <text x="852" y="124" text-anchor="middle" fill="#334155">RL vs TWAP, VWAP,</text>
  <text x="852" y="142" text-anchor="middle" fill="#334155">Almgren-Chriss, Immediate</text>
  <rect x="768" y="184" width="168" height="100" rx="8" fill="#fce7f3" stroke="#be185d"/>
  <text x="852" y="210" text-anchor="middle" fill="#0f172a" font-weight="bold">LLM governance</text>
  <text x="852" y="230" text-anchor="middle" fill="#334155">Claude explains the</text>
  <text x="852" y="248" text-anchor="middle" fill="#334155">decision in words;</text>
  <text x="852" y="266" text-anchor="middle" fill="#334155">cached JSON / template</text>

  <!-- arrows -->
  <path d="M214,92 L272,130" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M214,172 L272,150" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M214,92 L510,92" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M214,252 L510,252" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M452,142 L510,142" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M710,110 L768,110" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M710,234 L768,234" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <text x="24" y="320" fill="#334155">Solid arrows: regime inputs. Dashed: columns read directly into the state (liquidity, volatility, news z-score).</text>
  <text x="24" y="340" fill="#334155">The LLM does not produce features; it only explains finished decisions.</text>
</svg>
